plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.20'
}

version = mod_version
group = "com.hexagram2021.${mod_id}"

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        workingDirectory project.file('run/client')
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    server {
        workingDirectory project.file('run/server')
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    gameTestServer {
        workingDirectory project.file('run/testServer')
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    data {
        workingDirectory project.file('run/data')

        programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    // 命名空间级聚合资源（lang/sounds.json）单一来源（见 docs/MODULARIZATION.md 4.2）；过渡期根工程同样打包
    srcDir rootProject.file('shared-resources')
    exclude 'README.md'
}

repositories {
    maven {
        url "https://cursemaven.com"
    }
    maven {
        name 'tterrag maven'
        url 'https://maven.tterrag.com'
    }
    maven {
        name = 'Blamejared Maven'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'theillusivec4\'s Maven'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name 'DVS1 Maven FS'
        url 'https://dvs1.progwml6.com/files/maven'
    }
    maven {
        name 'DevOS'
        url 'https://mvn.devos.one/snapshots/'
    }
    maven {
        name 'Create Mod Maven'
        url 'https://maven.createmod.net/'
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        name = "Florensie's Maven"
        url = "https://maven.florens.be/releases"
    }
    maven {
        name = "ParchmentMC"
        url = "https://maven.parchmentmc.org/"
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    localRuntime 'be.florens:expandability-neoforge:12.0.0'
    localRuntime 'curse.maven:atlaslib-463826:5449009'
    localRuntime 'curse.maven:create-328085:7408951'
    localRuntime 'curse.maven:createaddition-439890:7518252'
    localRuntime 'curse.maven:travelersbackpack-321117:7543685'
    localRuntime 'curse.maven:hordes-485779:6772331'
    localRuntime 'curse.maven:jade-324717:8591319'
    localRuntime 'curse.maven:tetrachordlib-980149:5644644'
    localRuntime 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
}

// ============================================================================
// jar-in-jar 聚合：根工程自 M4 迁移完成后不再包含业务代码，五个模块以嵌套 jar 的形式
// 打进本 jar 的 META-INF/jarjar/，并生成 NeoForge 需要的 metadata.json。
// 发布时安装 root jar 即可获得全部内容；也可单独安装模块 jar（模块之间经 optional 依赖协作）。
// ============================================================================
def nestedModules = [
        'misc_twf_zombie_animals',
        'misc_twf_wildlife',
        'misc_twf_industry',
        'misc_twf_hearing',
        'misc_twf_adventure'
]

def nestedJarDir = layout.buildDirectory.dir('jarjar')

tasks.register('collectNestedJars', Copy) {
    nestedModules.each { moduleName ->
        dependsOn(":${moduleName}:jar")
        from(project(":${moduleName}").tasks.named('jar').flatMap { it.archiveFile })
    }
    into(nestedJarDir)
}

tasks.register('writeJarJarMetadata') {
    dependsOn 'collectNestedJars'
    def modules = nestedModules
    def outputDir = nestedJarDir
    def nestedVersion = mod_version.toString()
    doLast {
        def dir = outputDir.get().asFile
        def jars = modules.collect { moduleName ->
            def fileName = "${moduleName}-${nestedVersion}.jar"
            [
                    identifier  : [group: "com.hexagram2021.${moduleName}".toString(), artifact: moduleName],
                    version     : [range: "[${nestedVersion},)".toString(), artifactVersion: nestedVersion],
                    path        : "META-INF/jarjar/${fileName}".toString(),
                    isObfuscated: false
            ]
        }
        new File(dir, 'metadata.json').setText(
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([jars: jars])), 'UTF-8')
    }
}

tasks.named('jar', Jar) {
    dependsOn 'writeJarJarMetadata'
    from(nestedJarDir) {
        into 'META-INF/jarjar'
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}