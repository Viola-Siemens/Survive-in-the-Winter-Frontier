# Module: misc_twf_adventure (Adventure & Exploration)
# Phase 0 skeleton. External dependency list is a DRAFT (see docs/MODULARIZATION.md 4.1/4.3/6.2).
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Viola-Siemens/Survive-in-the-Winter-Frontier/issues"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    credits="Hexagram"
    authors="${mod_authors}"
    description='''${mod_description}'''

[[accessTransformers]]
    file="META-INF/accesstransformer.cfg"

[[mixins]]
    config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    versionRange="[21,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    versionRange="[1.21,1.21.1]"
    ordering="NONE"
    side="BOTH"

# travelersbackpack: TAC ammo slot upgrade & container mixins (mandatory)
[[dependencies.${mod_id}]]
    modId="travelersbackpack"
    versionRange="[1.21.1-10,)"
    ordering="NONE"
    side="BOTH"

# Gun mod: provided by Superb Warfare on 1.21.1 (runtime modId = superbwarfare); gun/ammo ids are rewritten in Phase B
[[dependencies.${mod_id}]]
    modId="superbwarfare"
    versionRange="[0.8.9,)"
    ordering="NONE"
    side="BOTH"

# geckolib: monster egg animations etc. (mandatory)
[[dependencies.${mod_id}]]
    modId="geckolib"
    versionRange="[4.8.4,)"
    ordering="NONE"
    side="BOTH"

# expandability: swimming tweaks on the blood fluid (mandatory)
[[dependencies.${mod_id}]]
    modId="expandability"
    versionRange="[12,)"
    ordering="NONE"
    side="BOTH"

# zombie_extreme: monster egg hatching pool & lair loot references (optional; runtime behaviour TBD, 6.2-E3)
[[dependencies.${mod_id}]]
    modId="zombie_extreme"
    type="optional"
    versionRange="[0.2.6.5,)"
    ordering="NONE"
    side="BOTH"

# kubejs: lair loot references to its items (optional, data-only)
[[dependencies.${mod_id}]]
    modId="kubejs"
    type="optional"
    versionRange="[1,)"
    ordering="NONE"
    side="BOTH"

# Optional cross-module links (see docs/MODULARIZATION.md 4.3 / 11.13):
# - misc_twf_hearing: monster egg hears noises via NoiseEmitEvent.Post (replaces Sona EXPOSURE);
# - misc_twf_zombie_animals: vaccine writes immunity through M1 public API (E7).
# Both are compileOnly/optional: missing modules must degrade instead of crashing (D5).
[[dependencies.${mod_id}]]
    modId="misc_twf_hearing"
    type="optional"
    versionRange="[4.0.0-alpha,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="misc_twf_zombie_animals"
    type="optional"
    versionRange="[4.0.0-alpha,)"
    ordering="NONE"
    side="BOTH"

# TODO Phase B: two code dependencies are not yet declared because their CurseForge coordinates are unknown:
# - com.seniors.justlevelingfork (skills/passives registry, used by MISCTWFSkills)
# - net.mcbbs.uid1525632.hungerreworkedreforged (AttributeRegistration, used by MISCTWFSkills)
# Sona is intentionally removed: hearing replaces EXPOSURE (D5).
