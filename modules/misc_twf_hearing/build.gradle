plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.20'
}

apply from: rootProject.file('gradle/module-common.gradle')

// 依赖（对应 docs/MODULARIZATION.md 11.3）：
// 核心零第三方依赖——不 import ZT2 / Improved Mobs / ServerCore / The Hordes / CrawlMod / Superb Warfare，
// 所有第三方兼容只能出现在 com.hexagram2021.misc_twf_hearing.compat 包内。
dependencies {
    // superbwarfare：枪声适配层编译依赖（可选：运行时由 HearingCompatBootstrap 用 ModList 判定后才加载适配类）
    compileOnly 'curse.maven:superb-warfare-1218165:7292699-sources-7292701'
}
